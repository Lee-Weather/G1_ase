env:
  numEnvs: 4096
  envSpacing: 5
  episodeLength: 500
  enableDebugVis: false
  pdControl: true
  powerScale: 1.0
  actionScale: 0.5
  # Zero action retains the default posture. +/-1 spans URDF limits plus 10% travel.
  # actionScale above is only used by legacy default_offset checkpoints.
  actionMapping: joint_limits
  actionLimitMargin: 0.1
  armature: 0.01
  # Pelvis height of the default posture (0.776 m by forward kinematics of
  # g1/mjcf/g1_29dof.xml, confirmed by the MuJoCo contact onset) plus a small
  # spawn clearance.
  initialHeight: 0.78
  controlFrequencyInv: 2
  stateInit: Hybrid
  hybridInitProb: 0.5
  numAMPObsSteps: 10
  localRootObs: true
  rootHeightObs: true
  keyBodies: [pelvis, torso_link, left_ankle_roll_link, right_ankle_roll_link, left_wrist_roll_link, right_wrist_roll_link]
  contactBodies: [left_ankle_pitch_link, left_ankle_roll_link, right_ankle_pitch_link, right_ankle_roll_link, left_wrist_roll_link, right_wrist_roll_link]
  selfCollisionFilterGroups:
    - [left_hip_pitch_link, left_hip_roll_link, left_hip_yaw_link, left_knee_link, left_ankle_pitch_link, left_ankle_roll_link]
    - [right_hip_pitch_link, right_hip_roll_link, right_hip_yaw_link, right_knee_link, right_ankle_pitch_link, right_ankle_roll_link]
  forceSensorBodies: [right_ankle_roll_link, left_ankle_roll_link]
  terminationHeight: 0.40
  terminationTilt: 1.0
  terminationContactForce: 1.0
  terminationContactHeight: 0.25
  enableEarlyTermination: true
  asset:
    assetRoot: ase/data/assets
    assetFileName: g1/mjcf/g1_29dof.xml
  plane:
    staticFriction: 0.8
    dynamicFriction: 0.8
    restitution: 0.0
  # Unitree G1 29-DoF PD gains used by the official deploy/velocity policy at
  # 50 Hz control (hip 100/2, knee 150/4, ankle 40/2, waist 200/5, arm 40/10).
  # Groups are matched by substring in this order, so keep them before any
  # shorter key that would also match.
  pdGains:
    hip_pitch: [100.0, 2.0]
    hip_roll: [100.0, 2.0]
    hip_yaw: [100.0, 2.0]
    knee: [150.0, 4.0]
    ankle_pitch: [40.0, 2.0]
    ankle_roll: [40.0, 2.0]
    waist_yaw: [200.0, 5.0]
    waist_roll: [200.0, 5.0]
    waist_pitch: [200.0, 5.0]
    shoulder: [40.0, 10.0]
    elbow: [40.0, 10.0]
    wrist: [40.0, 10.0]
  # Neutral standing posture: a moderate crouch whose centre of mass sits over the
  # ankle axes (search over hip/knee/ankle with a flat sole), with the arm
  # posture of the shipped G1 velocity policy (G1_deploy, g1_29dof). Foot stays
  # level because hip_pitch + knee + ankle_pitch = 0. Every angle is inside the
  # URDF limits; see czy/g1_wbt/scripts/search_g1_balance_pose.py.
  defaultJointPos:
    left_hip_pitch_joint: -0.240
    left_hip_roll_joint: 0.000
    left_hip_yaw_joint: 0.000
    left_knee_joint: 0.440
    left_ankle_pitch_joint: -0.200
    left_ankle_roll_joint: 0.000
    right_hip_pitch_joint: -0.240
    right_hip_roll_joint: 0.000
    right_hip_yaw_joint: 0.000
    right_knee_joint: 0.440
    right_ankle_pitch_joint: -0.200
    right_ankle_roll_joint: 0.000
    waist_yaw_joint: 0.000
    waist_roll_joint: 0.000
    waist_pitch_joint: 0.000
    left_shoulder_pitch_joint: 0.300
    left_shoulder_roll_joint: 0.250
    left_shoulder_yaw_joint: 0.000
    left_elbow_joint: 0.970
    left_wrist_roll_joint: 0.150
    left_wrist_pitch_joint: 0.000
    left_wrist_yaw_joint: 0.000
    right_shoulder_pitch_joint: 0.300
    right_shoulder_roll_joint: -0.250
    right_shoulder_yaw_joint: 0.000
    right_elbow_joint: 0.970
    right_wrist_roll_joint: -0.150
    right_wrist_pitch_joint: 0.000
    right_wrist_yaw_joint: 0.000
sim:
  dt: 0.01
  substeps: 2
  physx:
    num_threads: 4
    solver_type: 1
    num_position_iterations: 8
    num_velocity_iterations: 4
    contact_offset: 0.01
    rest_offset: 0.0
    bounce_threshold_velocity: 0.2
    max_depenetration_velocity: 1.0
    default_buffer_size_multiplier: 10.0
